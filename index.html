<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* HOME */
#home {
  position: fixed;
  inset: 0;
  background: linear-gradient(#4ec0ca, #ffffff);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.home-btn {
  width: 200px;
  padding: 10px;
  margin: 6px;
  font-size: 16px;
  border-radius: 8px;
}

/* THEME MENU HORIZONTAL */
#themeMenu {
  display: none;
  flex-direction: row;
  justify-content: center;
  gap: 10px;
  margin-top: 8px;
}

/* SQUARE THEME BUTTONS */
.theme-square {
  width: 50px;
  height: 50px;
  font-size: 20px;
  border-radius: 8px;
}

/* Small Round Button */
.small-round {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  font-size: 18px;
  padding: 0;
}

#iaboutBtn {
  position: absolute;
  bottom: 15px;
  right: 15px;
}

/* ACHIEVEMENTS */
#achievements {
  position: fixed;
  inset: 0;
  background: linear-gradient(#222,#444);
  color: white;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 20;
  text-align: center;
}

/* IABOUT */
#iaboutScreen {
  position: fixed;
  inset: 0;
  background: linear-gradient(#111,#333);
  color: white;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 25;
  text-align: center;
  padding: 20px;
}

/* GAME UI */
#ui {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 10;
  display: none;
}

#ui button {
  padding: 6px 10px;
  font-size: 14px;
}

/* GAME OVER */
#retryBtn {
  position: fixed;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  padding: 20px 40px;
  font-size: 18px;
  font-weight: bold;
  text-align: center;
  border-radius: 12px;
  background: white;
  display: none;
  z-index: 10;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home">
  <h1>Flappy Bird</h1>

  <button class="home-btn" onclick="startGame()">▶ Start Game</button>

  <!-- NORMAL THEME BUTTON -->
  <button class="home-btn" onclick="toggleThemeMenu()">🎨 Theme</button>

  <!-- THEME OPTIONS (HORIZONTAL) -->
  <div id="themeMenu">
    <button class="theme-square" onclick="selectTheme('city')">🏙</button>
    <button class="theme-square" onclick="selectTheme('night')">🌙</button>
    <button class="theme-square" onclick="selectTheme('sunny')">☀</button>
  </div>

  <button class="home-btn" onclick="showAchievements()">📊 Achievements</button>
  <button class="home-btn" onclick="exitGame()">❌ Exit</button>

  <button id="iaboutBtn" class="small-round" onclick="showIAbout()">ℹ</button>
</div>

<!-- ACHIEVEMENTS -->
<div id="achievements">
  <h2>🏆 Medal System</h2>
  <p id="medalInfo"></p>
  <p id="recentScore"></p>
  <p id="bestScore"></p>
  <button onclick="closeAchievements()">⬅ Back</button>
</div>

<!-- IABOUT -->
<div id="iaboutScreen">
  <h2>Founder</h2>
  <p><strong>Safani Fathima</strong></p>
  <p><strong>Sandhiya</strong></p>
  <br>
  <p>
    We created this game to make learning and coding fun.<br>
    Our goal is to build creative and exciting projects together.
  </p>
  <br>
  <button onclick="closeIAbout()">⬅ Back</button>
</div>

<div id="ui">
  <button onclick="goHome()">⬅ Menu</button>
</div>

<button id="retryBtn" onclick="retryGame()"></button>
<canvas id="game"></canvas>

<script>
const bgImg = new Image();
const birdImg = new Image();

const themes = {
  city: { bg: "img/city.png", bird: "img/greenbird.png" },
  night: { bg: "img/night.png", bird: "img/bird1-removebg-preview.png" },
  sunny: { bg: "img/sunny.png", bird: "img/birdwhite-removebg-preview.png" }
};

function loadTheme(name) {
  bgImg.src = themes[name].bg;
  birdImg.src = themes[name].bird;
}

function toggleThemeMenu() {
  const menu = document.getElementById("themeMenu");
  menu.style.display = menu.style.display === "flex" ? "none" : "flex";
}

function selectTheme(name) {
  loadTheme(name);
  document.getElementById("themeMenu").style.display = "none";
}

function startGame() {
  document.getElementById("home").style.display = "none";
  document.getElementById("ui").style.display = "block";
}

function goHome() {
  document.getElementById("home").style.display = "flex";
  document.getElementById("ui").style.display = "none";
}

function showAchievements() {
  document.getElementById("home").style.display = "none";
  document.getElementById("achievements").style.display = "flex";
}

function closeAchievements() {
  document.getElementById("achievements").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

function showIAbout() {
  document.getElementById("home").style.display = "none";
  document.getElementById("iaboutScreen").style.display = "flex";
}

function closeIAbout() {
  document.getElementById("iaboutScreen").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

function exitGame() {
  alert("Thanks for playing!");
}

loadTheme("city");
</script>

</body>
</html>
