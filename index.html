<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flappy Bird 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #4facfe, #00f2fe);
}

/* HOME SCREEN */
#homeScreen {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

#homeScreen h1 {
  color: white;
  font-size: 32px;
  margin-bottom: 20px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  margin: 8px;
  cursor: pointer;
}

/* Small Round Theme Buttons */
.themeBtn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 20px;
  padding: 0;
}

/* Theme container (Triangle shape) */
#themeOptions {
  display: none;
  position: relative;
  width: 150px;
  height: 120px;
}

/* Triangle positioning */
#theme1 {
  position: absolute;
  left: 50px;
  top: 0;
}

#theme2 {
  position: absolute;
  left: 0;
  top: 60px;
}

#theme3 {
  position: absolute;
  right: 0;
  top: 60px;
}

/* IABOUT BUTTON */
#iaboutBtn {
  position: absolute;
  bottom: 15px;
  right: 15px;
  width: 45px;
  height: 45px;
  border-radius: 50%;
}

/* ABOUT POPUP */
#aboutPopup {
  position: absolute;
  width: 80%;
  max-width: 300px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  display: none;
}

/* GAME CANVAS */
#gameCanvas {
  display: none;
  background: skyblue;
}
</style>
</head>

<body>

<!-- HOME SCREEN -->
<div id="homeScreen">
  <h1>Flappy Bird 3D</h1>

  <button onclick="startGame()">Start Game</button>

  <!-- THEMES BUTTON -->
  <button onclick="toggleThemes()">Themes</button>

  <!-- THEME OPTIONS (Triangle) -->
  <div id="themeOptions">
    <button id="theme1" class="themeBtn" onclick="setTheme('sky')">🌤</button>
    <button id="theme2" class="themeBtn" onclick="setTheme('dark')">🌙</button>
    <button id="theme3" class="themeBtn" onclick="setTheme('pink')">🌸</button>
  </div>
</div>

<!-- IABOUT BUTTON -->
<button id="iaboutBtn" onclick="showAbout()">i</button>

<!-- ABOUT POPUP -->
<div id="aboutPopup">
  <h3>Founder</h3>
  <p><b>Safani Fathima</b></p>
  <p><b>Sandhiya</b></p>
  <p>
    This game is created for fun and creativity.<br>
    Built with passion and learning spirit.
  </p>
  <button onclick="closeAbout()">Close</button>
</div>

<!-- GAME CANVAS -->
<canvas id="gameCanvas"></canvas>

<script>
let canvas = document.getElementById("gameCanvas");
let ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let birdY = canvas.height/2;
let gravity = 0.5;
let velocity = 0;

function startGame() {
  document.getElementById("homeScreen").style.display = "none";
  canvas.style.display = "block";
  gameLoop();
}

function gameLoop() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  velocity += gravity;
  birdY += velocity;

  ctx.beginPath();
  ctx.arc(100, birdY, 20, 0, Math.PI*2);
  ctx.fillStyle = "yellow";
  ctx.fill();

  requestAnimationFrame(gameLoop);
}

document.addEventListener("click", function(){
  velocity = -8;
});

/* THEMES */
function toggleThemes() {
  let menu = document.getElementById("themeOptions");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function setTheme(type) {
  if(type === "sky")
    document.body.style.background = "linear-gradient(to bottom,#4facfe,#00f2fe)";
  if(type === "dark")
    document.body.style.background = "black";
  if(type === "pink")
    document.body.style.background = "linear-gradient(to bottom,#ff9a9e,#fad0c4)";
}

/* ABOUT */
function showAbout() {
  document.getElementById("aboutPopup").style.display = "block";
}

function closeAbout() {
  document.getElementById("aboutPopup").style.display = "none";
}
</script>

</body>
</html>
