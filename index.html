<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flappy Bird</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 1;
}

/* HOME */
#home {
  position: fixed;
  inset: 0;
  background: linear-gradient(#4ec0ca, #ffffff);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#home button {
  width: 220px;
  padding: 12px;
  margin: 6px;
  font-size: 18px;
}

#themeMenu {
  display: none;
}

/* ACHIEVEMENTS */
#achievements {
  position: fixed;
  inset: 0;
  background: linear-gradient(#222,#444);
  color: white;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 20;
  text-align: center;
}

#achievements button {
  margin-top: 15px;
  padding: 10px 20px;
}

/* ABOUT SCREEN */
#aboutScreen {
  position: fixed;
  inset: 0;
  background: linear-gradient(#111,#333);
  color: white;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 25;
  text-align: center;
  padding: 20px;
}

/* GAME UI */
#ui {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 10;
  display: none;
}

#ui button {
  margin-left: 5px;
}

/* GAME OVER */
#retryBtn {
  position: fixed;
  left: 50%;
  top: 55%;
  transform: translate(-50%, -50%);
  padding: 25px 45px;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  border-radius: 12px;
  background: white;
  display: none;
  z-index: 10;
}
</style>
</head>

<body>

<div id="home">
  <h1>Flappy Bird</h1>
  <button onclick="startGame()">▶ Start Game</button>
  <button onclick="toggleThemeMenu()">🎨 Theme</button>

  <div id="themeMenu">
    <button onclick="selectTheme('city')">🏙 City</button>
    <button onclick="selectTheme('night')">🌙 Night</button>
    <button onclick="selectTheme('sunny')">☀ Sunny</button>
  </div>

  <button onclick="showAchievements()">📊 Achievements</button>
  <button onclick="exitGame()">❌ Exit</button>
</div>

<!-- ACHIEVEMENTS -->
<div id="achievements">
  <h2>🏆 Medal System</h2>
  <p id="medalInfo"></p>
  <p id="recentScore"></p>
  <p id="bestScore"></p>
  <button onclick="closeAchievements()">⬅ Back</button>
</div>

<!-- ABOUT -->
<div id="aboutScreen">
  <h2>👑 About Us</h2>

  <p><strong>Safani Fathima</strong></p>
  <p><strong>Sandhiya</strong></p>

  <br>

  <p>
    Flappy Bird is a fun and challenging arcade game.<br>
    Tap to fly, avoid pipes, and beat your high score!
  </p>

  <br>

  <button onclick="closeAbout()">⬅ Back</button>
</div>

<div id="ui">
  <button onclick="goHome()">⬅ Menu</button>
  <button onclick="showAbout()">ℹ About</button>
</div>

<button id="retryBtn" onclick="retryGame()"></button>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GAME_WIDTH = 320;
const GAME_HEIGHT = 480;

let scale = 1, offsetX = 0, offsetY = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.max(canvas.width / GAME_WIDTH, canvas.height / GAME_HEIGHT);
  offsetX = (canvas.width - GAME_WIDTH * scale) / 2;
  offsetY = (canvas.height - GAME_HEIGHT * scale) / 2;
}
window.addEventListener("resize", resize);
resize();

/* IMAGES */
const bgImg = new Image();
const birdImg = new Image();
const pipeTopImg = new Image();
const pipeBottomImg = new Image();

pipeTopImg.src = "img/up.png";
pipeBottomImg.src = "img/down.png";

/* THEMES */
const themes = {
  city: { bg: "img/city.png", bird: "img/greenbird.png" },
  night: { bg: "img/night.png", bird: "img/bird1-removebg-preview.png" },
  sunny: { bg: "img/sunny.png", bird: "img/birdwhite-removebg-preview.png" }
};

function loadTheme(name) {
  bgImg.src = themes[name].bg;
  birdImg.src = themes[name].bird;
}
loadTheme("city");

/* SOUND */
const flapSound = new Audio("audio/flap.mp3");
const hitSound = new Audio("audio/hit.mp3");
const scoreSound = new Audio("audio/score.wav");
const bgMusic = new Audio("audio/bg.mpeg");
bgMusic.loop = true;
bgMusic.volume = 0.5;

/* GAME STATE */
let bird, pipes, frame, score;
let recentScore = 0;
let gameOver = false;
let playing = false;
let waiting = false;
let highScore = localStorage.getItem("highScore") || 0;

function resetGame() {
  bird = { x: 60, y: 200, w: 34, h: 24, v: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  gameOver = false;
}

function addPipe() {
  pipes.push({ x: GAME_WIDTH, top: Math.random() * 180 + 40, passed: false });
}

/* MEDAL SYSTEM */
function getMedal(score) {
  if (score >= 30) return "🥇 Gold";
  if (score >= 15) return "🥈 Silver";
  if (score >= 5) return "🥉 Bronze";
  return "No Medal";
}

function endGame() {
  if (gameOver) return;

  hitSound.play();
  bgMusic.pause();
  gameOver = true;
  recentScore = score;

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("highScore", highScore);
  }

  document.getElementById("retryBtn").innerHTML =
    "Game Over<br><br>" +
    getMedal(score) + "<br><br>" +
    "Score: " + score +
    "<br>High Score: " + highScore +
    "<br><br>🔁 Retry";

  document.getElementById("retryBtn").style.display = "block";
}

function update() {
  if (!playing || gameOver || waiting) return;

  frame++;
  bird.v += 0.35;
  bird.y += bird.v;

  if (frame % 95 === 0) addPipe();

  pipes.forEach(p => {
    p.x -= 1.6;

    if (!p.passed && p.x + 52 < bird.x) {
      p.passed = true;
      score++;
      scoreSound.play();
    }

    const pipeWidth = 52;
    const gap = 180;

    const collideX = bird.x + bird.w > p.x &&
                     bird.x < p.x + pipeWidth;

    const collideTop = bird.y < p.top;
    const collideBottom = bird.y + bird.h > p.top + gap;

    if (collideX && (collideTop || collideBottom)) {
      endGame();
    }
  });

  if (bird.y < 0 || bird.y + bird.h > GAME_HEIGHT) endGame();
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.drawImage(bgImg, 0, 0, GAME_WIDTH, GAME_HEIGHT);
  ctx.drawImage(birdImg, bird.x, bird.y, bird.w, bird.h);

  pipes.forEach(p => {
    ctx.drawImage(pipeTopImg, p.x, p.top - 320, 52, 320);
    ctx.drawImage(pipeBottomImg, p.x, p.top + 180, 52, 320);
  });

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.fillText("HIGH SCORE: " + highScore, 20, 40);
  ctx.fillText("SCORE: " + score, 20, 70);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* CONTROLS */
function flap() {
  if (waiting) {
    waiting = false;
    bird.v = -6;
    flapSound.play();
    return;
  }
  if (!playing || gameOver) return;
  bird.v = -6;
  flapSound.play();
}

canvas.addEventListener("touchstart", flap);
document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
});

/* UI */
function startGame() {
  resetGame();
  waiting = true;
  playing = true;
  bgMusic.currentTime = 0;
  bgMusic.play();
  document.getElementById("home").style.display = "none";
  document.getElementById("ui").style.display = "block";
}

function retryGame() {
  resetGame();
  waiting = true;
  playing = true;
  bgMusic.currentTime = 0;
  bgMusic.play();
  document.getElementById("retryBtn").style.display = "none";
}

function goHome() {
  playing = false;
  bgMusic.pause();
  document.getElementById("home").style.display = "flex";
  document.getElementById("ui").style.display = "none";
  document.getElementById("retryBtn").style.display = "none";
}

function toggleThemeMenu() {
  const m = document.getElementById("themeMenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

function selectTheme(name) {
  loadTheme(name);
  document.getElementById("themeMenu").style.display = "none";
}

function showAchievements() {
  document.getElementById("home").style.display = "none";
  document.getElementById("achievements").style.display = "flex";

  document.getElementById("medalInfo").innerHTML =
    "Current Medal: " + getMedal(highScore);

  document.getElementById("recentScore").innerHTML =
    "🎯 Recent Score: " + recentScore;

  document.getElementById("bestScore").innerHTML =
    "🥇 High Score: " + highScore;
}

function closeAchievements() {
  document.getElementById("achievements").style.display = "none";
  document.getElementById("home").style.display = "flex";
}

function showAbout() {
  playing = false;
  bgMusic.pause();
  document.getElementById("aboutScreen").style.display = "flex";
}

function closeAbout() {
  document.getElementById("aboutScreen").style.display = "none";
  document.getElementById("ui").style.display = "block";
}

function exitGame() {
  alert("Thanks for playing!");
}

resetGame();
loop();
</script>

</body>
</html>
