<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const GAME_WIDTH = 320;
const GAME_HEIGHT = 480;

let scale = 1, offsetX = 0, offsetY = 0;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  scale = Math.max(canvas.width / GAME_WIDTH, canvas.height / GAME_HEIGHT);
  offsetX = (canvas.width - GAME_WIDTH * scale) / 2;
  offsetY = (canvas.height - GAME_HEIGHT * scale) / 2;
}
window.addEventListener("resize", resize);
resize();

/* IMAGES */
const bgImg = new Image();
const birdImg = new Image();
const pipeTopImg = new Image();
const pipeBottomImg = new Image();

pipeTopImg.src = "img/up.png";
pipeBottomImg.src = "img/down.png";

/* THEMES */
const themes = {
  city: { bg: "img/city.png", bird: "img/greenbird.png" },
  night: { bg: "img/night.png", bird: "img/bird1-removebg-preview.png" },
  sunny: { bg: "img/sunny.png", bird: "img/birdwhite-removebg-preview.png" }
};

function loadTheme(name) {
  bgImg.src = themes[name].bg;
  birdImg.src = themes[name].bird;
}

/* SOUND */
const flapSound = new Audio("audio/flap.mp3");
const hitSound = new Audio("audio/hit.mp3");
const scoreSound = new Audio("audio/score.wav");
const bgMusic = new Audio("audio/bg.mpeg");
bgMusic.loop = true;
bgMusic.volume = 0.5;

/* GAME DATA STORAGE */
let highScore = Number(localStorage.getItem("highScore")) || 0;
let recentScore = 0;
let totalGames = Number(localStorage.getItem("totalGames")) || 0;
let scoreHistory = JSON.parse(localStorage.getItem("scoreHistory")) || [];

/* GAME STATE */
let bird, pipes, frame, score;
let gameOver = false;
let playing = false;
let waiting = false;

function resetGame() {
  bird = { x: 60, y: 200, w: 34, h: 24, v: 0 };
  pipes = [];
  frame = 0;
  score = 0;
  gameOver = false;
}

function addPipe() {
  pipes.push({ x: GAME_WIDTH, top: Math.random() * 180 + 40, passed: false });
}

/* MEDAL SYSTEM */
function getMedal(score) {
  if (score >= 20) return "🥇 GOLD";
  if (score >= 10) return "🥈 SILVER";
  if (score >= 5) return "🥉 BRONZE";
  return "😢 No Medal";
}

function endGame() {
  if (gameOver) return;

  hitSound.play();
  bgMusic.pause();
  bgMusic.currentTime = 0;

  gameOver = true;
  recentScore = score;

  totalGames++;
  localStorage.setItem("totalGames", totalGames);

  scoreHistory.unshift(score);
  scoreHistory = scoreHistory.slice(0, 5);
  localStorage.setItem("scoreHistory", JSON.stringify(scoreHistory));

  if (score > highScore) {
    highScore = score;
    localStorage.setItem("highScore", highScore);
  }

  let medal = getMedal(score);

  document.getElementById("retryBtn").innerHTML =
    "Game Over<br><br>" +
    "Score: " + score +
    "<br>High Score: " + highScore +
    "<br>" + medal +
    "<br><br>🔁 Retry";

  document.getElementById("retryBtn").style.display = "block";
}

function update() {
  if (!playing || gameOver || waiting) return;

  frame++;
  bird.v += 0.35;
  bird.y += bird.v;

  if (frame % 95 === 0) addPipe();

  pipes.forEach(p => {
    p.x -= 1.6;

    if (!p.passed && p.x + 52 < bird.x) {
      p.passed = true;
      score++;
      scoreSound.play();
    }

    const pipeWidth = 52;
    const gap = 180;

    const collideX = bird.x + bird.w - 5 > p.x &&
                     bird.x + 5 < p.x + pipeWidth;

    const collideTop = bird.y + 5 < p.top;
    const collideBottom = bird.y + bird.h - 5 > p.top + gap;

    if (collideX && (collideTop || collideBottom)) endGame();
  });

  if (bird.y < 0 || bird.y + bird.h > GAME_HEIGHT) endGame();
}

function draw() {
  ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);
  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

  ctx.drawImage(bgImg, 0, 0, GAME_WIDTH, GAME_HEIGHT);
  ctx.drawImage(birdImg, bird.x, bird.y, bird.w, bird.h);

  pipes.forEach(p => {
    ctx.drawImage(pipeTopImg, p.x, p.top - 320, 52, 320);
    ctx.drawImage(pipeBottomImg, p.x, p.top + 180, 52, 320);
  });

  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "white";
  ctx.font = "bold 20px Arial";
  ctx.fillText("HIGH SCORE: " + highScore, 20, 40);
  ctx.fillText("SCORE: " + String(score).padStart(2, '0'), 20, 70);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

/* CONTROLS */
function flap() {
  if (waiting) {
    waiting = false;
    playing = true;
    bird.v = -6;
    flapSound.play();
    return;
  }
  if (!playing || gameOver) return;
  bird.v = -6;
  flapSound.play();
}

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  flap();
});

document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
});

/* UI */
function startGame() {
  resetGame();
  waiting = true;
  playing = true;
  bgMusic.currentTime = 0;
  bgMusic.play();
  document.getElementById("home").style.display = "none";
  document.getElementById("ui").style.display = "block";
}

function retryGame() {
  resetGame();
  waiting = true;
  playing = true;
  bgMusic.currentTime = 0;
  bgMusic.play();
  document.getElementById("retryBtn").style.display = "none";
}

function goHome() {
  playing = false;
  waiting = false;
  bgMusic.pause();
  bgMusic.currentTime = 0;
  document.getElementById("home").style.display = "flex";
  document.getElementById("ui").style.display = "none";
  document.getElementById("retryBtn").style.display = "none";
}

/* ACHIEVEMENTS SCREEN */
function openAchievements() {
  let historyText = scoreHistory.map(s => "• " + s).join("<br>");
  alert(
    "🏆 ACHIEVEMENTS\n\n" +
    "🎯 Recent Score: " + recentScore +
    "\n🥇 High Score: " + highScore +
    "\n🧮 Total Games Played: " + totalGames +
    "\n\n📜 Last 5 Scores:\n" + scoreHistory.join(", ") +
    "\n\n👑 Founders:\nSafani Fathima\nSandhiya"
  );
}

function toggleThemeMenu() {
  const m = document.getElementById("themeMenu");
  m.style.display = m.style.display === "block" ? "none" : "block";
}

function selectTheme(name) {
  loadTheme(name);
  document.getElementById("themeMenu").style.display = "none";
}

function exitGame() {
  bgMusic.pause();
  bgMusic.currentTime = 0;
  alert("Thanks for playing!");
}

/* INIT */
loadTheme("city");
resetGame();
loop();
</script>
